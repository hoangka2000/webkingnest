spring.application.name=yen-sao-kingnest
server.port=${PORT:8080}

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/

# PostgreSQL Database
# Production: set DB_URL/DB_USERNAME/DB_PASSWORD in environment
# Local default: postgres on localhost:5432, database kingnest
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kingnest}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:classpath:application-local.properties

# Checkout URL — Render tự set RENDER_EXTERNAL_URL; local dùng localhost
app.checkout.base-url=${RENDER_EXTERNAL_URL:${APP_CHECKOUT_BASE_URL:http://localhost:8080}}

# Gmail — đặt MAIL_PASSWORD (app password) qua biến môi trường hoặc application-local.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nguyendanghoang551@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.notify-to=${MAIL_NOTIFY_TO:nguyendanghoang551@gmail.com}
app.mail.from-name=Kingnest Đơn Hàng
