spring.application.name=yen-sao-kingnest
server.port=${PORT:8080}

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/kingnest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Checkout URL — Render tự set RENDER_EXTERNAL_URL; local dùng localhost
app.checkout.base-url=${RENDER_EXTERNAL_URL:${APP_CHECKOUT_BASE_URL:http://localhost:8080}}
