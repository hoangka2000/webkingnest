<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<meta name="keywords" content="{{ seo.keywords }}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="author" content="Kingnest - Yến Sào An Thịnh Nhân">
<meta name="geo.region" content="VN-34">
<meta name="geo.placename" content="Cam Ranh, Khánh Hòa">
<link rel="canonical" href="{{ seo.canonical }}">
<link rel="alternate" hreflang="vi-VN" href="{{ seo.canonical }}">
{% if seo.google_site_verification %}
<meta name="google-site-verification" content="{{ seo.google_site_verification }}">
{% endif %}
<meta property="og:locale" content="vi_VN">
<meta property="og:type" content="{{ seo.og_type }}">
<meta property="og:site_name" content="Kingnest - Yến Sào An Thịnh Nhân">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.og_image }}">
{% include "fragments/seo_jsonld.html" %}
